# dunst colours, light mode (Modus Operandi Tinted palette). Linked into dunstrc.d by the theme-mode hook
[global]
    frame_color = "#c4bcb0"
[urgency_low]
    background = "#efe9dd"
    foreground = "#595959"
    highlight = "#722ae6, #e4b5cb"
[urgency_normal]
    background = "#fbf7f0"
    foreground = "#000000"
    frame_color = "#5e5086"
    highlight = "#722ae6, #e4b5cb"
[urgency_critical]
    background = "#ffd7d7"
    foreground = "#a60000"
    frame_color = "#d54e53"
    highlight = "#d54e53, #fbf7f0"
