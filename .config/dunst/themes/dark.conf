# dunst colours, dark mode. Linked into dunstrc.d by ~/.config/theme-mode/hooks.d/80-dunst
[global]
    frame_color = "#a0a0a0"
[urgency_low]
    background = "#222222"
    foreground = "#ffffff"
    highlight = "#722ae6, #e4b5cb"
[urgency_normal]
    background = "#222222"
    foreground = "#ffffff"
    frame_color = "#5e5086"
    highlight = "#722ae6, #e4b5cb"
[urgency_critical]
    background = "#222222"
    foreground = "#ffffff"
    frame_color = "#d54e53"
    highlight = "#d54e53, #f0f0f0"
