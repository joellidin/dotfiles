; polybar for i3 on X11 (2026-11-08, third layout: transparent bar, a few roomy pills, workspace dots).
; Direction picked by Joel from the lookbook: Murz, Kanye, Mono, Bubblegum.
; Colours are X resources (i3wm.*) merged by ~/.config/theme-mode/hooks.d/70-i3 from ~/.config/x11/i3-{dark,light}.xres;
; the hook then runs ~/.local/bin/polybar-launch, which restarts the bar in place so the ${xrdb:...} refs are re-read.
; The bar window is a transparent full-width dock (i3 reserves it, smart_gaps keeps working); transparent borders
; inset the content. Each pill = cap module (half circle from Symbols Nerd Font, font 3) + modules with the pill
; background + cap module. Text glyphs are Font Awesome 4.7 codepoints from JetBrainsMono Nerd Font.

[colors]
transparent = #00000000
pill        = ${xrdb:i3wm.pill:#3c3836}
pillfg      = ${xrdb:i3wm.pillfg:#d5c4a1}
base00      = ${xrdb:i3wm.base00:#32302f}
base03      = ${xrdb:i3wm.base03:#665c54}
base04      = ${xrdb:i3wm.base04:#bdae93}
red         = ${xrdb:i3wm.base08:#fb4934}
yellow      = ${xrdb:i3wm.base0A:#fabd2f}
green       = ${xrdb:i3wm.base0B:#b8bb26}
aqua        = ${xrdb:i3wm.base0C:#8ec07c}
blue        = ${xrdb:i3wm.base0D:#83a598}
purple      = ${xrdb:i3wm.base0E:#d3869b}

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 18pt
dpi = ${xrdb:Xft.dpi:96}
background = ${colors.transparent}
foreground = ${colors.pillfg}
border-top-size = 10
border-bottom-size = 8
border-left-size = 10
border-right-size = 10
border-color = ${colors.transparent}
padding-left = 0
padding-right = 0
module-margin = 0
line-size = 2pt
font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;5
font-1 = Noto Color Emoji:fontformat=truetype:scale=10:antialias=false;2
; font 3: pill end caps. pixelsize/offset are tuned by measurement so the half circle spans the 44px pill.
font-2 = Symbols Nerd Font:pixelsize=19:rgba=none;8
; font 4 (%{T4}): Material Design icons (battery with bolt etc.)
font-3 = Symbols Nerd Font:size=13;4
; the left group (workspace dots, agents, keyboard flag) is the eww `leftbar` window, opened by polybar-launch
modules-left =
modules-center = date-l date date-r
modules-right = wifi-l wifi wifi-r audio-l recording mic volume audio-r sys-l battery tray powermenu sys-r
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ---------------- pill end caps ----------------
[module/cap-l]
type = custom/text
format = <label>
; %{O-1} pulls the next module 1px left over the glyph edge so no antialiased seam shows
label = %{O-1}
label-font = 3
label-foreground = ${colors.pill}

[module/cap-r]
type = custom/text
format = <label>
label = %{O-1}
label-font = 3
label-foreground = ${colors.pill}
label-margin-right = 1

[module/kbd-l]
inherit = module/cap-l
[module/kbd-r]
inherit = module/cap-r
[module/date-l]
inherit = module/cap-l
[module/date-r]
inherit = module/cap-r
label-margin-right = 0
[module/wifi-l]
inherit = module/cap-l
[module/wifi-r]
inherit = module/cap-r
[module/audio-l]
inherit = module/cap-l
[module/audio-r]
inherit = module/cap-r
[module/sys-l]
inherit = module/cap-l
[module/sys-r]
inherit = module/cap-r
label-margin-right = 0

; ---------------- modules ----------------
[module/date]
type = internal/date
interval = 5
date = %a %e %b
time = %H:%M
format = <label>
format-background = ${colors.pill}
format-padding = 2
format-prefix = "%{A1:~/.config/eww/scripts/toggle calendar:}  "
format-prefix-foreground = ${colors.blue}
format-suffix = "%{A}"
label = %date%   %time%

[module/wifi]
; event driven (nmcli monitor + iw); polybar's own wireless reader showed a stale SSID on this adapter
type = custom/script
exec = ~/.config/polybar/scripts/wifi
tail = true
format = <label>
format-background = ${colors.pill}
format-padding = 1
click-left = ~/.config/eww/scripts/toggle wifi
click-right = nm-connection-editor

[module/recording]
; dmenurecord writes /tmp/recordingicon and runs: polybar-msg action recording hook 0
type = custom/ipc
hook-0 = cat /tmp/recordingicon 2>/dev/null
initial = 1
format = <output>
format-background = ${colors.pill}
format-padding = 1

[module/mic]
; microphone mute state; XF86AudioMicMute in the i3 config runs: polybar-msg action mic hook 0
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/mic
initial = 1
format = <output>
format-background = ${colors.pill}
format-padding = 1
click-left = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && polybar-msg action mic hook 0

[module/volume]
; scripts/volume: event driven (pactl subscribe); click mutes, scroll changes volume and unmutes
type = custom/script
exec = ~/.config/polybar/scripts/volume
tail = true
format = <label>
format-background = ${colors.pill}
format-padding = 1

[module/battery]
; scripts/battery: Material battery glyph with the bolt built in while on AC (also at 100%), level glyph on battery,
; red at 15% and below; updates instantly on plug/unplug via `upower --monitor`; click opens quick settings
type = custom/script
exec = ~/.config/polybar/scripts/battery
tail = true
format = <label>
format-background = ${colors.pill}
format-padding = 1

[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.pill}
tray-background = ${colors.pill}
tray-size = 60%
tray-spacing = 2pt
tray-padding = 3pt

[module/powermenu]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.red}
label-background = ${colors.pill}
label-padding = 1
click-left = ~/.config/rofi/powermenu/type-1/powermenu.sh
