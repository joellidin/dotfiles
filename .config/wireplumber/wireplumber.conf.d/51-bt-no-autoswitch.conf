# Keep Bluetooth headphones in A2DP (music mode) when an app opens a mic. Calls use the laptop mic instead.
# Why: on PipeWire 1.6.2 headset mode picks the LC3-24kHz codec for AirPods, which is broken on this MediaTek
# chip (pipewire issue #5213, fixed upstream in 1.6.9).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
