# picom v13 config - HP ZBook Ultra G1a (AMD Strix Halo, 2880x1800 @ 120Hz)

# Backend - GLX recommended for AMD GPUs
backend = "glx";

# Sync frames to the display. With vsync off (and TearFree only "auto", so off on this panel) amdgpu
# rejects picom's immediate page flips: ~1,100 "present flip failed" lines a minute in the Xorg log.
vsync = true;

# GLX performance
use-damage = true;

# Blur (dual_kawase works only on GLX backend)
blur: {
  method = "dual_kawase";
  strength = 5;
};

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;

# Rounded corners
corner-radius = 8;

# Animations
animations = true;

# Fading
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;

# Window type rules
rules = (
  { match = "window_type = 'dock'";    shadow = false; blur-background = false; },
  # polybar is a full-width transparent dock with the pills drawn inside it, so the dock rule above must keep
  # applying (blur or shadow on the window would show as a band across the top of the screen)
  { match = "window_type = 'desktop'"; shadow = false; blur-background = false; },
  { match = "window_type = 'tooltip'"; shadow = false; },
  { match = "class_i = 'slop'";        blur-background = false; shadow = false; },
  # rofi draws its own corners (24 px cards, and square top corners on the password card that hangs from the
  # screen edge), so picom must not round them again
  { match = "class_g = 'Rofi'";        corner-radius = 0; },
  # eww left bar: a 70 ms fade instead of the ~140 ms default, so it is gone sooner when a window goes
  # fullscreen; the fade wait in ~/.local/bin/bar-control (fade=0.08) matches it
  { match = "class_g = 'Eww' && window_type = 'dock'";
    animations = ({ triggers = ["open", "close", "show", "hide"];
      opacity = { duration = 0.07; start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
      blur-opacity = "opacity"; shadow-opacity = "opacity"; }); },
  # Tiled windows cast no shadow (it showed as a grey frame on a light desktop); floating
  # windows keep it. i3 sets I3_FLOATING_WINDOW=1 on floating windows for exactly this.
  { match = "window_type = 'normal' && !(I3_FLOATING_WINDOW@ = 1)"; shadow = false; },
);
